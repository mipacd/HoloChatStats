server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # cache built assets aggressively (they're content-hashed by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # SPA routing — everything falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Flask JSON API
    location /api/ {
        proxy_pass http://web:80;           # change :80 to web's internal port if different
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Flask-SocketIO (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
    # (optional) Flask-served static assets, if any pages still need them
    location /static/ {
        proxy_pass http://web:80;
    }
}