name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      force_restore:
        description: Re-run the database restore (destructive)
        type: boolean
        default: false
      full_provision:
        description: Re-run full provisioning
        type: boolean
        default: false
      wipe_docker:
        description: 'DANGER: erase every Docker container, image, and volume before bootstrap'
        type: boolean
        default: false

concurrency:
  group: holochatstats-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Floci and its persistent volume live on this host. Do not use an
    # ephemeral GitHub-hosted runner for this deployment.
    # Target the repository's existing runner. A custom `holochatstats` label
    # is not required, so a freshly registered runner can accept the job.
    runs-on: [self-hosted]
    # A first-time streamed restore of the legacy database can take hours.
    timeout-minutes: 360
    environment: production
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      # setup-python only publishes Linux toolcache builds for the operating
      # systems used by GitHub-hosted runners; it cannot install 3.12 on a
      # native Debian 13 self-hosted runner. The deploy CLI is version-neutral,
      # while Lambda artifacts are still built in python:3.12-slim below.
      - name: Set up system Python virtual environment
        run: |
          python3 --version
          python3 -m venv .venv || {
            echo 'Unable to create a venv. Install python3-venv on the runner.'
            exit 1
          }
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install tooling and test dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -r requirements-dev.txt boto3 botocore

      - name: Validate repository
        run: |
          python -m compileall -q common handlers infra llm_chat web
          python -m unittest discover -s tests -v
          docker compose -f infra/docker-compose.yml config --quiet

      - name: Require production secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_USER_AGENT: ${{ secrets.YOUTUBE_USER_AGENT }}
        run: |
          test -n "$DB_PASSWORD" || { echo 'DB_PASSWORD is required'; exit 1; }
          test -n "$YT_API_KEY" || { echo 'YT_API_KEY is required'; exit 1; }
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            test -n "$YOUTUBE_USER_AGENT" || {
              echo 'YOUTUBE_USER_AGENT is required when YOUTUBE_COOKIES_B64 is set.'
              echo 'Use the exact full User-Agent from the browser that exported the cookies.'
              exit 1
            }
            python scripts/validate_youtube_cookies.py
          fi

      - name: Validate destructive bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.wipe_docker }}
        env:
          DUMP_URL: ${{ secrets.DUMP_URL }}
          DUMP_SHA256: ${{ secrets.DUMP_SHA256 }}
        run: |
          set -euo pipefail
          test ! -f /.dockerenv || {
            echo 'Refusing to wipe Docker: the Actions runner itself is containerized.'
            exit 1
          }
          test -n "$DUMP_URL" || { echo 'DUMP_URL is required for bootstrap'; exit 1; }
          [[ "$DUMP_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'DUMP_SHA256 must be a 64-character SHA-256 digest'
            exit 1
          }
          curl --fail --silent --show-error --head --max-time 30 "$DUMP_URL" >/dev/null
          echo 'Remote dump is reachable; destructive bootstrap is authorized.'

      - name: Wipe Docker for one-time bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.wipe_docker }}
        run: |
          set -euo pipefail
          docker container ls --all --quiet | xargs --no-run-if-empty docker container rm --force
          docker volume prune --all --force
          docker system prune --all --volumes --force
          echo 'Docker containers, images, build cache, networks, and volumes removed.'

      - name: Preflight Docker storage and RDS image
        run: |
          set -euo pipefail
          echo 'Docker storage:'
          docker info --format 'root={{.DockerRootDir}} driver={{.Driver}}'
          # Backing Filesystem is reported in DriverStatus on some Docker
          # releases and is not a portable top-level template property.
          docker info --format 'driver-status={{json .DriverStatus}}'
          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
          df -h "$DOCKER_ROOT"
          df -i "$DOCKER_ROOT"
          # Floci combines this repository with EngineVersion pg16. Pull it
          # through the host daemon first so extraction errors are not hidden
          # behind an RDS timeout.
          docker pull pgvector/pgvector:pg16
          docker image inspect pgvector/pgvector:pg16 \
            --format 'RDS image ready: {{.Id}} ({{.Size}} bytes)'

      - name: Start Floci
        run: docker compose -f infra/docker-compose.yml up -d --remove-orphans

      - name: Wait for the AWS edge
        run: |
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:4566; then
              echo 'edge is up'; exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs --tail 80 floci
          exit 1

      - name: Deploy
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_USER_AGENT: ${{ secrets.YOUTUBE_USER_AGENT }}
          LLM_SECRETS_JSON: ${{ secrets.LLM_SECRETS_JSON }}
          DUMP_URL: ${{ secrets.DUMP_URL }}
          DUMP_SHA256: ${{ secrets.DUMP_SHA256 }}
          FORCE_RESTORE: ${{ github.event.inputs.force_restore }}
          FULL_PROVISION: ${{ github.event.inputs.full_provision }}
        run: |
          set -euo pipefail
          EXTRA=()
          [ "${FORCE_RESTORE:-false}" = true ] && EXTRA+=(--force-restore)
          [ "${FULL_PROVISION:-false}" = true ] && EXTRA+=(--full)
          python infra/deploy.py --auto "${EXTRA[@]}" \
            --endpoint http://localhost:4566 \
            --lambda-endpoint http://floci:4566 \
            --create-rds \
            --db-name youtube_data \
            --db-internal-host floci \
            --channels-file web/channel.json \
            --backlog-floor 2026-07-01T00:00:00+00:00 \
            --frontend-port 80 \
            --frontend-host-port 80 \
            --stream-restore \
            --restore-mode docker \
            --restore-network chat-ingest_default \
            --restore-image pgvector/pgvector:pg18 \
            --build-in-docker

      - name: Clean up database restore helpers
        if: always()
        run: |
          docker rm --force \
            chat-ingest-restore-renderer \
            chat-ingest-restore-loader 2>/dev/null || true

      - name: Verify deployed schema and dependencies
        run: |
          python scripts/invoke.py migrate --action verify_schema
          python scripts/invoke.py migrate --action ping

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo '### HoloChatStats'
            echo '```'
            if curl --fail --silent --max-time 2 -o /dev/null http://localhost:4566; then
              python scripts/admin_url.py --endpoint http://localhost:4566 || \
                echo 'Admin URL is not available yet.'
            else
              echo 'Floci is not reachable on localhost:4566.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emulator logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200 floci
